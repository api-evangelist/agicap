    post:
      description: 'Export all the bank journal entries ready to be exported. You need to provide the export id as a Guid


        The bank journal entries will become exported instead of ready to be exported and won''t be exportable anymore, they can be retrieved later on with the same

        `exportId` with the GET Export endpoint.


        The bank journal is returned as a JSON payload.


        The maximum number of entries in a bank journal is limited (currently 5000), if you have more entries to export, simply export several journals with

        different `exportId`.


        Note that the exported counterparts custom fields include the ERP identification fields from business document when imported in Agicap.

        This section is only for ERPs requiring the count of bank journals and bank journal entries created during the year

        If your ERP does not require these counts, you can simply specify an empty request body ("" or "{}").


        For the first export of the year via Agicap, if a user has already created bank journals outside Agicap and its ERP needs to know

        these counts, you can specify where to start the counts of bank journal and bank journal entries in the current year, by specifying in the request

