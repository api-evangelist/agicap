        exportDateUtc:
          description: The export date-time in UTC format
          example: '2024-10-28T14:30:59.999Z'
          type: string
        exportId:
          description: Unique ID of the export.
          example: 31dee215-e458-4145-8fe8-c20a0ea06042
          format: uuid
