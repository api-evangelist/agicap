components:
  schemas:
    PaymentsFileGeneration.Web.Models.Presentations.ThirdPartyPresentation:
      additionalProperties: false
      properties:
        iban:
          type: string
        name:
          type: string
      required:
      - iban
      - name
      type: object
    PaymentsFileGeneration.Web.Models.Presentations.InvalidThirdPartyProblemDetails:
      additionalProperties: {}
      properties:
        additionalInformations:
          items:
            $ref: '#/components/schemas/PaymentsFileGeneration.Web.Models.Presentations.ThirdPartyPresentation'
          type: array
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        status:
          format: int32
          type:
          - integer
          - 'null'
        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
      required:
      - additionalInformations
      type: object
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      additionalProperties: {}
      properties:
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        status:
          format: int32
          type:
          - integer
          - 'null'
        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    ApiKey:
      description: Used for internal API endpoints instead of bearer token
      in: header
      name: X-API-Key
      type: apiKey
    Bearer:
      scheme: Bearer
      type: http
    bearerAuth:
      bearerFormat: OPAQUE
      scheme: bearer
      type: http
    bearer_client_credentials:
      flows:
        clientCredentials:
          scopes:
            agicap:public-api: Access to the public API
            public-api:import_payment_files: Import payment files
            public-api:import_payment_files_with_signed_beneficiaries: Import payment files with signed beneficiaries
          tokenUrl: https://myaccount.agicap.com/connect/token
      type: oauth2
