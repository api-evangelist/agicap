openapi: 3.2.0
info:
  contact: {}
  title: Tests Response formats API
  version: v1
servers:
- url: https://api.agicap.com
- url: https://api.agicap.internal
tags:
- name: Response formats
paths:
  /public/httpbin/v1/brotli:
    get:
      responses:
        '200':
          description: Brotli-encoded data.
        '401':
          description: Unauthorized request.
        '403':
          description: Forbidden request.
        '429':
          description: Too many requests. Please try again later.
      security:
      - client_credentials:
        - agicap:public-api
      - bearerAuth: []
      summary: Returns Brotli-encoded data
      tags:
      - Response formats
      operationId: getPublicHttpbinV1Brotli
      x-operation-id-source: derived
  /public/httpbin/v1/deflate:
    get:
      responses:
        '200':
          description: Defalte-encoded data.
        '401':
          description: Unauthorized request.
        '403':
          description: Forbidden request.
        '429':
          description: Too many requests. Please try again later.
      security:
      - client_credentials:
        - agicap:public-api
      - bearerAuth: []
      summary: Returns Deflate-encoded data
      tags:
      - Response formats
      operationId: getPublicHttpbinV1Deflate
      x-operation-id-source: derived
  /public/httpbin/v1/deny:
    get:
      responses:
        '200':
          description: Denied message
        '401':
          description: Unauthorized request.
        '403':
          description: Forbidden request.
        '429':
          description: Too many requests. Please try again later.
      security:
      - client_credentials:
        - agicap:public-api
      - bearerAuth: []
      summary: Returns page denied by robots.txt rules
      tags:
      - Response formats
      operationId: getPublicHttpbinV1Deny
      x-operation-id-source: derived
