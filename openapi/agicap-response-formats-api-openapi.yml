        '429':
          description: Too many requests. Please try again later.
      security:
      - client_credentials:
        - agicap:public-api
      - bearerAuth: []
      summary: Returns a UTF-8 encoded body
      tags:
      - Response formats
      operationId: getPublicHttpbinV1EncodingUtf8
      x-operation-id-source: derived
  /public/httpbin/v1/gzip:
