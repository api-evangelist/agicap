components:
  schemas:
    CreateConnectionDto:
      additionalProperties: false
      properties:
        integrationName:
          description: Name of the data source
          nullable: true
          type: string
        name:
          description: Name of the connection
          nullable: true
          type: string
        source:
          description: 'Enables the identification of the team responsible for developing the connector. This field helps track which party developed the integration, providing transparency for troubleshooting, support, and future updates.

            - If you are an external integrator, put the "External integrator - `{name_of_your_company}`"

            - If you are the user’s in-house development team, put “Internal  team”'
          nullable: true
          type: string
      title: CreateConnection
      type: object
    ProblemDetails:
      additionalProperties: false
      properties:
        detail:
          nullable: true
          type: string
        instance:
          nullable: true
          type: string
        status:
          format: int32
          nullable: true
          type: integer
        title:
          nullable: true
          type: string
        type:
          nullable: true
          type: string
      type: object
    ConnectionToCreate:
      additionalProperties: false
      properties:
        Name:
          description: Connection name
          type: string
      type: object
    ConnectionDto:
      additionalProperties: false
      properties:
        entityId:
          description: Agicap entity unique identifier
          type: string
        id:
          description: Connection unique identifier
          format: uuid
          type: string
        integrationName:
          description: 'Name of the data source. Example : Sage100, SAP B1'
          nullable: true
          type: string
        name:
          description: Name of the connection
          type: string
        source:
          description: 'Enables the identification of the team responsible for developing the connector. This field helps track which party developed the integration, providing transparency for troubleshooting, support, and future updates.

            - If you are an external integrator, put the "External integrator - `{name_of_your_company}`"

            - If you are the user’s in-house development team, put “Internal  team”'
          nullable: true
          type: string
      title: Connection
      type: object
    ConnectionSummaryPagedResult:
      additionalProperties: false
      properties:
        Items:
          items:
            $ref: '#/components/schemas/ConnectionSummary'
          nullable: true
          type: array
        Pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
    Pagination:
      additionalProperties: false
      properties:
        CurrentPageItemsCount:
          format: int32
          type: integer
        CurrentPageNumber:
          format: int32
          type: integer
        PageSize:
          format: int32
          type: integer
        PagesCount:
          format: int32
          type: integer
        TotalItemsCount:
          format: int32
          type: integer
      type: object
    ConnectionSummary:
      additionalProperties: false
      properties:
        Id:
          description: Connection identifier
          format: uuid
          type: string
        Name:
          description: Connection name
          type: string
        Type:
          description: Type of the connection. Possible values are PUBLIC_API, SWIFT, EBICS, EDITRAN
          type: string
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
    bearerAuth:
      bearerFormat: OPAQUE
      scheme: bearer
      type: http
