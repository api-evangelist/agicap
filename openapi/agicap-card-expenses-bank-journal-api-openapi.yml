openapi: 3.2.0
info:
  contact: {}
  description: Allows to export the accounted list of all card expenses from Business Spend Management
  title: Card expenses bank journal API
  version: v1
servers:
- url: https://api.agicap.com
- url: https://api.agicap.internal
security:
- Bearer: []
tags:
- name: Card expenses bank journal
paths:
  /public/card-expenses-bank-journal/v1/entities/{entityId}/accounting-transactions:
    get:
      description: '# Getting Started:


        ## Export your card expenses bank journal entries from Agicap to your accounting software


        Welcome to the card expenses bank journal entries API documentation. This guide is designed to help you seamlessly export bank journal entries to your accounting software from Agicap.


        ## Introduction


        Before starting, make sure with your Account Manager that the relevant option is activated in Agicap on your entity = Pre-Accounting with the export option “External accounting softwares”. After that, you need your accountant to prepare the journal entries and click on “export to my accounting software” for them to be available from the API database.


        ## Set up a connexion to retrieve journal entries


        ### Step 1: Generate Client Credentials


        To get started, you’ll need to generate client credentials. These credentials will authenticate your API requests. For detailed instructions, please refer to our Introduction Guide.


        ### Step 2: Retrieve Entity


        Each connection must be associated with an entity. You’ll need the `entity id` to create a connection.


        - If you already have the `entity id`, skip to Step 3.

        - To retrieve the `entity id`:

        1. **List Organizations**: Use the following request (Get Organizations)

        2. **List Entities**: Use the following request (Get Entities) to find the entities associated with your organization

        3. **Select the Entity Owner**: Choose the entity that will be the owner of the connection.


        ### Step 3: Get bank journal entries


        We recommend creating a separate connection for each entity to keep data sources distinct and maintain clarity within Agicap. To get bank journal entries, make the following API call: Get accounting transactions.'
      operationId: GetAccountingTransactionLines
      parameters:
      - in: path
        name: entityId
        required: true
        schema:
          format: int32
          type: integer
      - in: query
        name: LastSynchronizationDate
        schema:
          format: date-time
          type: string
      - in: query
        name: PageSize
        schema:
          format: int32
          type: integer
      - in: query
        name: PageNumber
        schema:
          format: int32
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResult_1_PreAccounting.Queries.BankJournal.AccountingTransactionLine'
            text/json:
              schema:
                $ref: '#/components/schemas/PagedResult_1_PreAccounting.Queries.BankJournal.AccountingTransactionLine'
            text/plain:
              schema:
                $ref: '#/components/schemas/PagedResult_1_PreAccounting.Queries.BankJournal.AccountingTransactionLine'
          description: OK
        '401':
          description: Unauthorized request.
        '403':
          description: Forbidden request.
        '429':
          description: Too many requests. Please try again later.
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: An internal server occurred.
      security:
      - bearer_client_credentials:
        - agicap:public-api
      - bearerAuth: []
      summary: Retrieve your card expense bank journal entries
      tags:
      - Card expenses bank journal
components:
  schemas:
    AccountingTransactionDebit:
      additionalProperties: false
      properties:
        accountNumber:
          description: number of the account posted
          type: string
        accountType:
          allOf:
          - $ref: '#/components/schemas/AccountingTransactionAccountType'
          description: type of bookkeeping account
        amount:
          description: amount of the transaction
          format: double
          type: number
        currency:
          description: currency of the transaction
          type: string
        thirdPartyAccount:
          description: label for the account posted
          type: string
      required:
      - accountNumber
      - accountType
      - amount
      - currency
      - thirdPartyAccount
      type: object
    AccountingTransactionLine:
      additionalProperties: false
      properties:
        credit:
          allOf:
          - $ref: '#/components/schemas/AccountingTransactionCredit'
          description: amount applied to the credit column
        debit:
          allOf:
          - $ref: '#/components/schemas/AccountingTransactionDebit'
          description: amount applied to the debit column
        paymentDate:
          description: date of the payment
          format: date-time
          type: string
        supplierOrMerchant:
          description: name of the supplier
          type: string
        title:
          description: title manually entered
          type: string
        uniqueId:
          description: GUID
          type: string
      required:
      - credit
      - debit
      - paymentDate
      - supplierOrMerchant
      - title
      - uniqueId
      type: object
    Pagination:
      additionalProperties: false
      properties:
        currentPageItemsCount:
          format: int32
          type: integer
        currentPageNumber:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
        pagesCount:
          format: int32
          type: integer
        totalItemsCount:
          format: int32
          type: integer
      required:
      - currentPageItemsCount
      - currentPageNumber
      - pagesCount
      - pageSize
      - totalItemsCount
      type: object
    AccountingTransactionCredit:
      additionalProperties: false
      properties:
        accountNumber:
          description: number of the account posted
          type: string
        accountType:
          allOf:
          - $ref: '#/components/schemas/AccountingTransactionAccountType'
          description: type of bookkeeping account
        amount:
          description: amount of the transaction
          format: double
          type: number
        currency:
          description: currency of the transaction
          type: string
        thirdPartyAccount:
          description: label for the account posted
          type: string
      required:
      - accountNumber
      - accountType
      - amount
      - currency
      - thirdPartyAccount
      type: object
    PagedResult_1_PreAccounting.Queries.BankJournal.AccountingTransactionLine:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccountingTransactionLine'
          type: array
        pagination:
          allOf:
          - $ref: '#/components/schemas/Pagination'
      required:
      - items
      - pagination
      type: object
    AccountingTransactionAccountType:
      additionalProperties: false
      enum:
      - SupplierAccount
      - BankLedger
      type: string
    ProblemDetails:
      additionalProperties: false
      properties:
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        status:
          format: int32
          type:
          - integer
          - 'null'
        title:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    Bearer:
      scheme: Bearer
      type: http
    bearerAuth:
      bearerFormat: OPAQUE
      scheme: bearer
      type: http
    bearer_client_credentials:
      description: 'Client credentials: bearer'
      flows:
        clientCredentials:
          scopes:
            agicap:public-api: ''
          tokenUrl: https://myaccount.agicap.com/connect/token
      type: oauth2
