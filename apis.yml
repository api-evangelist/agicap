aid: agicap
name: Agicap
description: 'Agicap is a European cash-flow and liquidity management platform headquartered in Lyon,
  France, backed by Partech and other investors. Its software helps businesses forecast cash flow, manage
  accounts payable and receivable, run and secure payments, connect banking data, control spend, and handle
  e-invoicing. Agicap exposes a substantial Public API at api.agicap.com: 19 REST APIs spanning Treasury
  bank journals, Business Documents (invoices, credit notes), Payments and beneficiaries, Banking documents,
  Accounts Receivable clients, Suppliers, Financing & Investments, Pre-accounting, E-Invoicing, and an
  Events/Webhooks API. Authentication is OAuth2 client-credentials via an IdentityServer authorization
  server (myaccount.agicap.com), errors follow RFC 9457 problem+json, and the company publishes a trust
  center (SOC 2, ISO 27001), a bug-bounty program, and a status page.'
url: https://raw.githubusercontent.com/api-evangelist/agicap/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
x-backed-by:
- partech
x-tier: enriched
x-tier-reason: public-api-captured
